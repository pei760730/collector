# Keep GitHub Actions current automatically.
#
# Why this file exists: on 2026-07-26 a fleet-wide scan found 25 of 26 repos had
# no dependabot at all, and every one of them was a full MAJOR version behind on
# actions/checkout, setup-python and friends. A moving tag like `@v5` only moves
# inside its own major line — once v6 ships, `@v5` is frozen and nothing says so.
#
# Schedule: dependabot has no "biweekly" interval, and cron has no week-parity
# field either, so "every two weeks" is expressed as the 1st and 15th. Fixed
# dates on purpose — a true 14-day cycle drifts across weekdays over time.
#
# grouped on purpose: the default (one PR per action) turns into a drizzle of
# PRs to triage. One bundled PR per run is reviewable in a single pass.
version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: cron
      cronjob: "0 9 1,15 * *"
      timezone: Asia/Taipei
    cooldown:
      default-days: 7
    groups:
      github-actions:
        patterns:
          - "*"
  # npm 也要管:2026-07-31 開安全警報後首掃,本 repo 累積 critical×1+high×4
  # (vitest 2 舊鏈 + googleapis-common 釘死的舊 gaxios)—— 基線只蓋
  # github-actions,npm 沒人看。節奏對齊 actions(1/15 號彙整)。
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: cron
      cronjob: "0 9 1,15 * *"
      timezone: Asia/Taipei
    cooldown:
      default-days: 7
    groups:
      npm:
        patterns:
          - "*"
