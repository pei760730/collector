# Keep GitHub Actions current automatically.
#
# Why this file exists: on 2026-07-26 a fleet-wide scan found 25 of 26 repos had
# no dependabot at all, and every one of them was a full MAJOR version behind on
# actions/checkout, setup-python and friends. A moving tag like `@v5` only moves
# inside its own major line — once v6 ships, `@v5` is frozen and nothing says so.
#
# Schedule: dependabot has no "biweekly" interval, and cron has no week-parity
# field either, so "every two weeks" is expressed as the 1st and 15th. Fixed
# dates on purpose — a true 14-day cycle drifts across weekdays over time.
#
# grouped on purpose: the default (one PR per action) turns into a drizzle of
# PRs to triage. One bundled PR per run is reviewable in a single pass.
version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: cron
      cronjob: "0 9 1,15 * *"
      timezone: Asia/Taipei
    cooldown:
      default-days: 7
    groups:
      github-actions:
        patterns:
          - "*"
  # npm 也要管:2026-07-31 開安全警報後首掃,本 repo 累積 critical×1+high×4
  # (vitest 2 舊鏈 + googleapis-common 釘死的舊 gaxios)—— 基線只蓋
  # github-actions,npm 沒人看。節奏對齊 actions(1/15 號彙整)。
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: cron
      cronjob: "0 9 1,15 * *"
      timezone: Asia/Taipei
    cooldown:
      default-days: 7
    groups:
      npm:
        patterns:
          - "*"
    ignore:
      # dev 工具鏈大版不走月批自動提案(2026-08-01 首批 npm 月批實撞:
      # TS 5.9→7.0/6.0 打爆 typecheck、vitest 3→4 剛出爐、@types/node 26=
      # Node 26 型別但 CI 跑 20/22 —— types 該釘 runtime 線)。
      # 大版升級走 deliberate PR:本機實跑 typecheck+test 再釘。minors/patches 照流。
      #
      # ⚠️ 這條 ignore 擋的是「大版自動進來」這個模式,**不是**「這一版不要」。ignore 一寫上去
      # 就沒有任何機制會再提醒,deliberate PR 沒人開 = 靜默凍結。2026-08-15 實際發生:8/1 寫下
      # 這條後沒人開過 deliberate PR,14 天後 core 已在 TS 7 + vitest 4,消費端還停在 TS 6 +
      # vitest 3,上下游工具鏈分岔。**下次加 ignore 時,同一支 PR 就要決定誰在什麼時候開那支
      # deliberate PR**,否則別加。
      #
      # 2026-08-15 deliberate PR 已消化 TS 6.0.3→7.0.2 + vitest 3.2.7→4.1.10:
      # 零程式碼改動、tsconfig 不需補 types:["node"](本 repo @types/node 仍正常載入,
      # 已用植入型別錯誤反驗 typecheck 不是空跑),dist 的 40 支 .js 與 TS 6 逐檔 sha256 相同。
      # @types/node 維持 22:它釘的是 runtime 線(CI 跑 Node 22、core engines >=22),不是釘最新。
      - dependency-name: typescript
        update-types: ["version-update:semver-major"]
      - dependency-name: vitest
        update-types: ["version-update:semver-major"]
      - dependency-name: "@types/node"
        update-types: ["version-update:semver-major"]
      # 自家 git-tag 依賴完全不走月批:collector-core 由 core-bump.yml 每日 cron
      # 專管(呼叫 core 的 consumer-bump.yml,SSOT 在 core 端)。兩套機制同時管一個
      # pin 會撞上面那個 cooldown 窗 —— 2026-08-15 實撞:v0.5.0 當天 03:52 打 tag
      # (< cooldown 7 天)被排除,dependabot 算出的「合格最新版」= v0.4.0(07-25),
      # 於是把 core-bump 剛推上去的 spec 往回寫成 v0.5.0→v0.4.0 降級;而舊 core 的
      # API 沒斷,CI 全綠,肉眼幾乎抓不到。`@dependabot rebase` 回「已與 main 同步」、
      # `recreate` 重算同結果 —— 它認為降級才是正解,只能手改(PR #105)。
      - dependency-name: "@pei760730/collector-core"
