name: core-bump

# collector-core 發新版後自動開 bump PR。邏輯單一實作在 core 的 consumer-bump.yml(reusable;原三 collector 共用,#9 併一後只剩本 repo 一支 caller),
# 本檔只是薄 caller。職責只到「發現新版 → surgical bump → 開 PR → dispatch CI → 通知」,merge 仍等 owner 授權。
on:
  schedule:
    - cron: "17 22 * * *" # 台北 06:17;public repo cron 會節流漂移,日常有跑到即可
  workflow_dispatch: # 手動觸發 = 立即檢查;選非 main ref 觸發 = 測試路徑(bump branch 從該 ref 切)

permissions:
  contents: write # push bump branch
  pull-requests: write # 開 bump PR
  actions: write # dispatch ci.yml(GITHUB_TOKEN 開的 PR 不自動觸發 pull_request)

concurrency:
  group: core-bump
  cancel-in-progress: false # 會推 branch/開 PR,取消到一半留半套,寧可排隊

jobs:
  bump:
    uses: pei760730/collector-core/.github/workflows/consumer-bump.yml@main
    # 最小權限:顯式只傳 kai-notify 兩把(= 對方 workflow_call.secrets 宣告的全部)。
    # 不用 secrets: inherit —— 那會把本 repo 全部 secrets(三組 bot token / SA 私鑰)整包
    # 交給跨 repo 的 reusable workflow;顯式傳遞後,@main 端就算被改壞,波及面只剩通知兩把。
    secrets:
      KAI_NOTIFY_BOT_TOKEN: ${{ secrets.KAI_NOTIFY_BOT_TOKEN }}
      KAI_NOTIFY_CHAT_ID: ${{ secrets.KAI_NOTIFY_CHAT_ID }}

  # ── 被中止(cancelled)的唯一出口 ─────────────────────────────────────────
  # core 那端的 `bump` job 有 timeout-minutes: 30(實測最長 14.4 分)。逾時到點 /
  # 人為按停 → conclusion 是 `cancelled` 而非 `failure`,GitHub 直接跳過剩下的步驟,
  # 所以 consumer-bump.yml 裡那個 `if: failure()` 的 kai-notify 對這個狀態完全免疫。
  # 這支又是 cron(每日 06:17)且不在 kai-notify/fleet-digest 的 MONITORED 名單裡 ——
  # 三層剛好對齊成一個靜默盲區:被中止 = 這輪沒開 bump PR,而 owner 收不到任何訊息。
  # step 層條件看不到這個狀態,只有 job 層的 needs.<job>.result 看得到,故必須獨立 job。
  # 同 th-ops/remind.yml、ig-insights-sync/token-refresh.yml 的既有寫法。
  notify-cancelled:
    needs: bump
    if: ${{ always() && needs.bump.result == 'cancelled' }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions: {} # 只送通知,不需要上面那三把 write
    steps:
      - name: Error annotation (API-blip resilient)
        run: echo "::error::collector core-bump was CANCELLED (timeout or manual stop) — 這輪沒檢查 collector-core 新版、沒開 bump PR。"

      - name: Report to Kai (kai-notify, fail-soft)
        uses: pei760730/kai-notify@v1
        env:
          KAI_NOTIFY_BOT_TOKEN: ${{ secrets.KAI_NOTIFY_BOT_TOKEN }}
          KAI_NOTIFY_CHAT_ID: ${{ secrets.KAI_NOTIFY_CHAT_ID }}
        with:
          text: "🟠 collector core-bump 被中止(逾時或人為按停)——這輪沒檢查 core 新版、沒開 bump PR,需要重跑 — ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
